[project]
name = "yolo26-defect-detection"
version = "0.1.0"
description = "基于 YOLO26 的材料缺陷检测系统"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4.21",
    "opencv-python>=4.9.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "albumentations>=1.4.0",
    "h5py>=3.16.0",
    "pyside6>=6.11.1",
]

[tool.uv]
python-preference = "only-managed"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
